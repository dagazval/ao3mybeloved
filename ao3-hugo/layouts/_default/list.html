{{ define "main" }}
<section class="chapter-index">
    <h2>{{ .Title }}</h2>

    <ul class="items">
        {{ range .Pages.ByParam "chapterNumber" }}
        <li>
            <h3>
                <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            </h3>
        </li>
        {{ end }}
    </ul>
</section>
{{ end }}
